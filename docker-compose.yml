services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      TRACE_LOG: "1"
      # ANTHROPIC_API_KEY: ...   # ver README: AnthropicLLM não está ligado por padrão
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
